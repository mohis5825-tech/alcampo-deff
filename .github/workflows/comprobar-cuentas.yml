name: Consultar cuentas propias

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      telegram:
        description: Enviar el informe a Telegram
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: alcampo-${{ github.repository }}
  cancel-in-progress: false

jobs:
  consultar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GOOGLE_CREDS_B64: ${{ secrets.GOOGLE_CREDS_B64 }}
      SHEET_ID: ${{ vars.SHEET_ID }}
      WORKSHEET: ${{ vars.WORKSHEET }}
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      CHAT_ID: ${{ secrets.CHAT_ID }}
      SEND_TELEGRAM: ${{ (github.event_name == 'workflow_dispatch' && inputs.telegram) || (github.event_name == 'schedule' && vars.SEND_TELEGRAM != 'false') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Instalar dependencias
        run: python -m pip install -r requirements-lock.txt
      - name: Pruebas sin conexiones externas
        run: python -m unittest discover -s tests -v
      - name: Validar fuente y configuración de notificaciones
        shell: bash
        run: |
          args=(--check-config)
          if [[ "$SEND_TELEGRAM" == "true" ]]; then
            args+=(--telegram)
          fi
          python script.py "${args[@]}"
      - name: Instalar Chromium
        run: python -m playwright install --with-deps chromium
      - name: Probar Chromium con la web ficticia local
        env:
          ALCAMPO_BROWSER_TESTS: '1'
        run: python -m unittest discover -s tests -p 'test_browser_local.py' -v
      - name: Consultar y generar informe
        shell: bash
        run: |
          args=(--max-seconds 3000)
          if [[ "$SEND_TELEGRAM" == "true" ]]; then
            args+=(--telegram)
          fi
          python script.py "${args[@]}"
      - name: Conservar informe y progreso, también si falla la ejecución
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-${{ github.run_id }}
          path: |
            resultados/resultados.xlsx
            resultados/progreso.json
          if-no-files-found: ignore
          retention-days: 1

